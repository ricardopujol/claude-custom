<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>claude-custom indexing</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <!-- Backlog #66: the indexing assistant's toast (?part=toast, bottom right) or its "N filed" list (?part=list, top
       right under the strip). Main stacks this view over the tab views and sizes it to #root's height; a page with
       nothing to show reports 0 and is hidden. Transparent: only the panel paints. -->
  <style>
    :root {
      --win: #11131a; --chrome: #171a23; --panel: #1e222d; --border: #262b38; --text: #c7cede; --dim: #6d7689;
      --accent: #d08c4a; --ok: #5fb07a; --warn: #e6c34a; --bad: #cc5f5f;
    }
    /* The page reports its natural height and main caps the view to the window: past the cap it scrolls here. Never a
       height in vh: the view's size comes FROM the reported height, so a vh cap would feed back into itself. */
    html { overflow-x: hidden; overflow-y: auto; }
    html, body { margin: 0; background: transparent; color: var(--text);
      font: 12.5px/1.45 "Segoe UI", system-ui, sans-serif; }
    #root { display: block; }
    button { font: inherit; font-size: 12px; background: var(--chrome); color: var(--text);
      border: 1px solid var(--border); border-radius: 5px; padding: 2px 9px; cursor: pointer; }
    button:hover { border-color: var(--dim); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* the toast */
    .toast { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px 8px;
      display: grid; gap: 6px; box-sizing: border-box; width: 100%; }
    .toast.unfiled .t1, .toast.cant-undo .t1 { color: var(--warn); }
    .toast.added .t1 { color: var(--accent); }
    .toast.error .t1 { color: var(--bad); }
    .t1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .note { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .bar { height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--dim); width: 100%; animation: drain linear forwards; }
    @keyframes drain { to { width: 0%; } }
    /* the list */
    .pop { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px; display: grid; gap: 2px;
      box-sizing: border-box; width: 100%; }
    .head { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 4px; color: var(--dim);
      font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .x { border: 0; background: transparent; color: var(--dim); padding: 0 4px; }
    .x:hover { color: var(--text); }
    .empty { color: var(--dim); padding: 8px 6px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 6px; border-radius: 4px; }
    .row:hover { background: var(--chrome); }
    .row .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .when { font-family: Consolas, monospace; font-size: 11px; color: var(--dim); }
    .row .where { grid-column: 1 / -1; font-family: Consolas, monospace; font-size: 11px; color: var(--accent); }
    .row.unfiled .where { color: var(--warn); }
    .row.undone { opacity: .55; }
    .row.undone .where { color: var(--dim); }
    .row .mini { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
    .row .mini button { font-size: 11px; padding: 1px 8px; }
    @media (prefers-reduced-motion: reduce) { .bar i { animation: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./indexing-display.js"></script>
</body>
</html>
