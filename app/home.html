<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Jiandu Home</title>
  <!-- Jiandu Home (documentation/DESIGN_PROJECT_HUB.md). No inline script, no network: the cards come from main over the preload. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <style>
    /* The strip's look tokens (app/tab-strip.html), so Home reads as the same app. */
    :root {
      --bg: #11131a; --chrome: #171a23; --border: #262b38; --text: #c7cede;
      --dim: #6d7689; --accent: #d08c4a; --ok: #5fb07a; --bad: #cc5f5f;
      --pin: color-mix(in srgb, var(--text) 62%, var(--accent));
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.4 var(--font-ui, "Segoe UI", system-ui, sans-serif); }
    body { display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--chrome);
      border-bottom: 1px solid var(--border); flex: 0 0 auto; }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; }
    #summary { color: var(--dim); }
    .grow { flex: 1 1 auto; }
    #filter { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px;
      width: 220px; font: inherit; }
    #filter:focus { outline: none; border-color: var(--accent); }
    button { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 9px;
      font: inherit; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    #notice { color: var(--dim); padding: 6px 16px 0; min-height: 18px; flex: 0 0 auto; }
    main { flex: 1 1 auto; overflow-y: auto; padding: 10px 16px 16px; }
    #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .card { background: var(--chrome); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; display: flex;
      flex-direction: column; gap: 6px; min-width: 0; }
    /* H7: a card that needs you does not move; its orange border shows it. */
    .card.needs { border-color: var(--accent); }
    .card .head { display: flex; align-items: center; gap: 6px; }
    .card .label { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card.pinned .pin-mark::before { content: '\1F4CC'; font-size: 11px; color: var(--pin); }
    .card .root { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .status { display: flex; gap: 10px; font-size: 12px; }
    .card.open .state { color: var(--ok); }
    .card.needs .state { color: var(--accent); }
    .card .used { color: var(--dim); }
    .lanes { display: flex; flex-wrap: wrap; gap: 4px; }
    .lane { font-size: 11px; padding: 1px 7px; border-radius: 10px; }
    .lane.needs { border-color: var(--accent); color: var(--accent); }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .empty { color: var(--dim); padding: 40px 0; text-align: center; grid-column: 1 / -1; }
    footer { color: var(--dim); font-size: 11px; padding: 6px 16px; border-top: 1px solid var(--border); flex: 0 0 auto; }
  </style>
</head>
<body>
  <header>
    <h1>Jiandu Home</h1>
    <span id="summary"></span>
    <span class="grow"></span>
    <input id="filter" type="search" placeholder="Filter projects" aria-label="Filter projects" spellcheck="false" />
    <button id="choose">Choose a folder…</button>
  </header>
  <div id="notice" role="status"></div>
  <main><div id="cards"></div></main>
  <footer>Home stays open. Closing it leaves every project window as it is.</footer>
  <script src="home-display.js"></script>
</body>
</html>
