<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- Replaced at runtime by the project folder; main.js preventDefaults
       page-title-updated so the page can never take it back. -->
  <title>claude-custom</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'" />
  <link rel="stylesheet" href="agent-colour.css" />
  <style>
    :root {
      --bg: #11131a; --chrome: #171a23; --border: #262b38; --text: #c7cede;
      --dim: #6d7689; --accent: #d08c4a; --ok: #5fb07a; --bad: #cc5f5f;
      /* Worktree occupancy: an agent is working in this tab's folder / two writers. */
      --warn: #e6c34a;
      /* Backlog #52: a session in a /bedtime night. A still, deep blue: movement on the strip means "needs you". */
      --night: #1a2350; --night-edge: #7f93e0;
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 12px/1.3 var(--font-ui, "Segoe UI", system-ui, sans-serif); overflow: hidden; user-select: none; }
    /* The strip is a fixed 34px; main places the tab views below it. */
    #strip { height: 34px; box-sizing: border-box; display: flex; align-items: stretch;
      background: var(--chrome); border-bottom: 1px solid var(--border); }
    #tabs { display: flex; align-items: stretch; min-width: 0; overflow: hidden; }
    /* 2A (documentation/DESIGN_TAB_STRIP.md): tabs shrink to 112 px, the label ellipsizing; app/tab-lanes.js MIN_TAB is this number.
       Past it the page moves the tabs that don't fit into the Lanes menu (+N). */
    .tab { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 10px; min-width: 112px; max-width: 240px;
      flex: 0 1 auto; box-sizing: border-box; border-right: 1px solid var(--border); cursor: default; white-space: nowrap; }
    .tab > * { flex-shrink: 0; }
    .tab > .label { flex-shrink: 1; min-width: 0; }
    /* Drag to reorder (#141): a bar on the edge where the dragged tab will land. ::after is the occupancy stripes'. */
    .tab.drop-before::before, .tab.drop-after::before { content: ''; position: absolute; top: 4px; bottom: 4px; width: 2px;
      background: var(--accent); pointer-events: none; }
    .tab.drop-before::before { left: -1px; }
    .tab.drop-after::before { right: -1px; }
    /* A tab leaving the strip (merged, ended, closed): a short fade in its place; app/tab-strip.js keeps the ghost ~250 ms. */
    .tab.leaving { pointer-events: none; overflow: hidden; animation: tab-leave 250ms ease-out forwards; }
    @keyframes tab-leave { to { opacity: 0; min-width: 0; max-width: 0; padding-left: 0; padding-right: 0; border-right-width: 0; } }
    /* Worktree occupancy (#44 + #47, take B "hatched edge"): the lower edge turns to diagonal stripes while an
       agent is working in this tab's folder, in the warn colour when its own session is writing too. Still,
       always: movement on the strip means "needs you", and this is only "somebody is here". */
    .tab.occupied::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; pointer-events: none;
      background: repeating-linear-gradient(135deg, var(--agent) 0 3px, transparent 3px 6px); }
    .tab.occupied-warn::after { background: repeating-linear-gradient(135deg, var(--warn) 0 3px, transparent 3px 6px); }
    .agent-tags { display: inline-flex; gap: 2px; flex: 0 0 auto; }
    .agent-tag { font-size: 9px; line-height: 1; padding: 1px 3px; border-radius: 3px; color: var(--agent);
      border: 1px solid color-mix(in srgb, var(--agent) 55%, transparent); font-variant-numeric: tabular-nums; }
    .tab.occupied-warn .agent-tag { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
    /* #81: only readers are in this folder (an agent of a read-only side session): the initials stay, dimmed, with no
       hatched edge, because nobody is writing here. */
    .tab.reading .agent-tag { opacity: 0.6; border-style: dashed; }
    /* #81: a branch tab's read-only side session, right after it: smaller than a branch tab, dashed where it joins. */
    .tab.side { font-size: 11px; max-width: 170px; padding: 0 8px; border-left: 1px dashed var(--border); }
    .tab.side .label { font-style: italic; }
    /* #119 A5: a branch tab's plain shell, right after it (and after its side tab): the same small shape, dashed where it joins. */
    .tab.shell { font-size: 11px; max-width: 170px; padding: 0 8px; border-left: 1px dashed var(--border); }
    .tab:hover { background: color-mix(in srgb, var(--accent) 10%, var(--chrome)); }
    .tab.selected { background: var(--bg); box-shadow: inset 0 -2px 0 var(--accent); }
    /* The night tab (#52). After .selected so it wins the background; the accent line still says which tab is open.
       Never animated, and #31's pulse (which animates the background) still wins while the tab needs you. */
    .tab.night { background: var(--night); }
    .tab.night:hover { background: color-mix(in srgb, var(--night) 82%, white); }
    .tab.night .label { color: color-mix(in srgb, var(--text) 85%, var(--night-edge)); }
    .moon { font-size: 11px; line-height: 1; }
    /* #156: cross-session messages held for approval in this tab; a still pill, the tab's own pulse says "look" */
    .envelope { font-size: 11px; line-height: 1; padding: 1px 5px; border-radius: 8px; color: var(--chrome); background: var(--warn, #e6c34a); }
    /* Lean mode (#62): the button and the chip. The chip is a still pill; Back to normal is the way out. */
    #lean-btn { flex: 0 0 auto; align-self: center; margin-right: 4px; height: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--dim); border-radius: 4px; cursor: pointer; font-size: 11px; padding: 0 8px; }
    #lean-btn:hover { color: var(--text); border-color: var(--dim); }
    #lean-btn[hidden], #lean-chip[hidden], #lean-chip-night[hidden] { display: none; }
    #lean-chip { flex: 0 0 auto; align-self: center; display: flex; align-items: center; gap: 6px; margin-right: 4px; height: 20px;
      padding: 0 3px 0 8px; border-radius: 4px; border: 1px solid var(--night-edge); background: var(--night); color: var(--text); font-size: 11px; }
    #lean-chip-night { color: color-mix(in srgb, var(--text) 80%, var(--night-edge)); font-variant-numeric: tabular-nums; }
    #lean-back { height: 14px; border: 0; border-radius: 3px; background: color-mix(in srgb, var(--night-edge) 25%, transparent);
      color: var(--text); cursor: pointer; font-size: 10px; padding: 0 6px; }
    #lean-back:hover { background: color-mix(in srgb, var(--night-edge) 45%, transparent); }
    body.frameless #lean-btn, body.frameless #lean-chip { -webkit-app-region: no-drag; }
    body.lean .dot.working { animation: none; }
    /* the working agents' still portraits, left of the chip (#62, option C): 18 px, round, at most six then +N */
    #lean-faces { flex: 0 0 auto; align-self: center; display: flex; align-items: center; gap: 3px; margin-right: 6px; }
    #lean-faces[hidden] { display: none; }
    .lean-face { width: 18px; height: 18px; border-radius: 50%; overflow: hidden; flex: 0 0 auto; display: flex;
      outline: 1px solid var(--agent, var(--accent)); outline-offset: 0; }
    .lean-face .face-media { width: 100%; height: 100%; object-fit: cover; display: block; font-size: 8px; line-height: 18px;
      text-align: center; color: #12141c; }
    .lean-more { font-size: 10px; color: var(--dim); padding: 0 2px; }
    .tab.dim .label { color: var(--dim); }
    .tab.dim { opacity: 0.75; }
    .label { overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
    .dot.working { background: var(--ok); animation: pulse 1.2s ease-in-out infinite; }
    .dot.needs { background: var(--accent); }
    /* OSC 7501: the CLI's own state. Existing tokens; no new animation (movement on the strip means "needs you"). */
    .dot.needs.error { background: var(--bad); }
    .dot.done { background: var(--ok); }
    .dot.error { background: var(--bad); }
    .glyph { font-size: 11px; }
    .mark { font-size: 12px; line-height: 1; flex: 0 0 auto; }
    .health { font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; }
    .x { border: 0; background: transparent; color: var(--dim); cursor: pointer; font-size: 14px;
      line-height: 1; padding: 0 2px; border-radius: 3px; }
    .x:hover { color: var(--text); background: var(--border); }
    #strip-alert { flex: 1 1 auto; min-width: 0; align-self: center; margin: 0 10px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; color: var(--bad); }
    #strip-alert[hidden] { display: none; }
    /* The ▾ menu of running sessions: pinned right, past the alert's flex. */
    #bg { margin-left: auto; flex: 0 0 auto; width: 34px; border: 0; border-left: 1px solid var(--border);
      background: transparent; color: var(--dim); cursor: pointer; font-size: 13px; }
    #bg:hover { color: var(--text); background: var(--border); }
    #bg:disabled { cursor: progress; color: var(--accent); }
    /* The kill switch's STOP ALL (documentation/PLAN_SAFETY_NET.md lane 2): red, on the strip because lean mode, which a /bedtime
       night turns on, hides every rail. Its wording, look and place are Ricardo's call (the PR's open question); this is the default. */
    #stop-all { flex: 0 0 auto; align-self: center; margin-right: 6px; height: 20px; border: 1px solid var(--bad); border-radius: 4px;
      background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); cursor: pointer; font-size: 11px; font-weight: 600;
      letter-spacing: 0.04em; padding: 0 8px; }
    #stop-all:hover { background: var(--bad); color: #fff; }
    #stop-all:disabled { cursor: progress; opacity: 0.6; }
    #strip-alert.info { color: var(--dim); }
    /* Layout pass L2 (#28): a frameless window. The strip is the title bar, so
       it drags the window (and a double-click maximises: Windows does that on a
       drag region); everything you click in it opts out. */
    body.frameless #strip { -webkit-app-region: drag; }
    body.frameless .tab, body.frameless #strip button, body.frameless #strip form,
    body.frameless #strip-alert { -webkit-app-region: no-drag; }
    .win-btn { flex: 0 0 auto; width: 44px; border: 0; background: transparent; color: var(--dim);
      cursor: pointer; font-size: 13px; }
    .win-btn[hidden] { display: none; }
    .win-btn:hover { color: var(--text); background: var(--border); }
    #win-close:hover { color: #fff; background: #c42b1c; }
    /* #63: a session tree over 40% CPU for 30 s. Amber, red from 75%. A chip, never animated. */
    .res-warn { font-size: 10px; line-height: 1; padding: 1px 4px; border-radius: 3px; font-variant-numeric: tabular-nums; }
    .res-warn.amber { color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); }
    .res-warn.red { color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 55%, transparent); }
    .badge { font-size: 10px; padding: 0 4px; border-radius: 3px; }
    .badge.merged { color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 55%, transparent); }
    .badge.warn { color: var(--bad); font-size: 11px; }
    /* PR 3: the + (main pops its menu) and the branch form. Both live outside
       #tabs: a repaint rebuilds #tabs, and must not wipe what is being typed. */
    /* The Lanes menu (1B) and the +N overflow (2A): one fixed-width button, so the room the tabs get never depends on its text. */
    #lanes { flex: 0 0 auto; width: 92px; border: 0; border-left: 1px solid var(--border); background: transparent; color: var(--dim);
      cursor: pointer; font: inherit; font-size: 11px; white-space: nowrap; padding: 0 6px; }
    #lanes:hover { color: var(--text); background: color-mix(in srgb, var(--accent) 10%, var(--chrome)); }
    #lanes.overflow { color: var(--accent); }
    #lanes[hidden] { display: none; }
    #plus { border: 0; background: transparent; color: var(--dim); cursor: pointer; font-size: 17px;
      line-height: 1; padding: 0 12px; flex: 0 0 auto; }
    #plus:hover { color: var(--text); background: color-mix(in srgb, var(--accent) 10%, var(--chrome)); }
    #plus[hidden], #create[hidden] { display: none; }
    #create { display: flex; align-items: center; gap: 4px; margin: 0 0 0 6px; flex: 0 0 auto; }
    #create-branch { width: 200px; height: 22px; box-sizing: border-box; padding: 0 6px; border-radius: 3px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border); font: inherit; user-select: text; }
    #create-branch:focus { outline: none; border-color: var(--accent); }
    #create-branch:disabled { color: var(--dim); }
    #create-cancel { border: 0; background: transparent; color: var(--dim); cursor: pointer; font-size: 13px; padding: 0 4px; }
    #create-cancel:hover { color: var(--text); }
    /* BACKLOG #119 A6: the form's second way to start, a lane from a GitHub issue. The row is a button (dim text and
       disabled when gh can't list); the list is a panel over the area under the strip, which main empties of the
       selected tab's page while it is open (a tab's page is a native view and would cover it). */
    #create-issues { height: 22px; box-sizing: border-box; padding: 0 8px; border-radius: 3px; cursor: pointer; flex: 0 0 auto;
      background: transparent; color: var(--dim); border: 1px solid var(--border); font: inherit; white-space: nowrap; }
    #create-issues:hover:not(:disabled) { color: var(--text); border-color: var(--dim); }
    #create-issues.dim, #create-issues:disabled { border-color: transparent; color: var(--dim); font-style: italic; cursor: default; }
    #create-issues[hidden] { display: none; }
    #issues-panel { position: absolute; top: 34px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column;
      background: var(--bg); }
    #issues-panel[hidden] { display: none; }
    #issues-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    #issues-filter { flex: 1 1 auto; height: 24px; box-sizing: border-box; padding: 0 8px; border-radius: 3px; background: var(--chrome);
      color: var(--text); border: 1px solid var(--border); font: inherit; user-select: text; }
    #issues-filter:focus { outline: none; border-color: var(--accent); }
    #issues-close { border: 0; background: transparent; color: var(--dim); cursor: pointer; font-size: 13px; padding: 0 4px; }
    #issues-close:hover { color: var(--text); }
    #issues-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 6px; }
    .issue-row { display: flex; align-items: baseline; gap: 8px; width: 100%; box-sizing: border-box; padding: 6px 8px; border: 0;
      border-radius: 4px; background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
    .issue-row:hover, .issue-row:focus-visible { background: color-mix(in srgb, var(--accent) 12%, var(--bg)); outline: none; }
    .issue-num { flex: 0 0 auto; color: var(--accent); font-variant-numeric: tabular-nums; }
    .issue-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .issue-label { flex: 0 0 auto; font-size: 10px; line-height: 1; padding: 2px 5px; border-radius: 3px; color: var(--dim);
      border: 1px solid var(--border); }
    .issue-branch { flex: 0 1 auto; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim);
      font: 11px Consolas, "Cascadia Mono", monospace; }
    #issues-note { padding: 10px 14px; color: var(--dim); }
    #issues-note[hidden] { display: none; }
    /* Backlog #66, the indexing field (DESIGN_INDEXING_ASSISTANT.md, revised: a verbatim inbox): a note typed here never
       goes into a session; Enter adds it to the chip's project's backlog `## Inbox`; the counter opens today's list. STATIC, outside #tabs, so a
       repaint never wipes what is being typed. Its toast and list are app/indexing-overlay.html, over the tab views. */
    #index ~ #bg { margin-left: 0; }
    #index { margin-left: auto; flex: 0 1 340px; min-width: 150px; align-self: center; display: flex; align-items: center; gap: 6px;
      margin-right: 4px; height: 24px; box-sizing: border-box; padding: 0 3px 0 8px; border-radius: 6px;
      background: var(--bg); border: 1px solid var(--border); }
    #index:focus-within { border-color: var(--accent); }
    #index-note { flex: 1 1 auto; min-width: 0; height: 100%; border: 0; outline: none; background: transparent;
      color: var(--text); font: inherit; font-size: 12px; padding: 0; user-select: text; }
    #index-note::placeholder { color: var(--dim); }
    #index-chip { flex: 0 1 auto; min-width: 0; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      border: 1px solid var(--border); background: transparent; color: var(--dim); border-radius: 4px; cursor: pointer;
      font: 11px/16px Consolas, "Cascadia Mono", monospace; padding: 0 6px; }
    #index-chip:hover { color: var(--text); border-color: var(--dim); }
    #index-count { flex: 0 0 auto; align-self: center; margin-right: 6px; height: 20px; border: 1px solid var(--border);
      background: color-mix(in srgb, var(--accent) 6%, var(--chrome)); color: var(--text); border-radius: 4px; cursor: pointer;
      font: 11px/18px Consolas, "Cascadia Mono", monospace; padding: 0 6px; white-space: nowrap; }
    #index-count:hover { border-color: var(--dim); }
    #index-count.pending { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
    #index-count[aria-expanded="true"] { border-color: var(--accent); }
    #index-chip:focus-visible, #index-count:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    @keyframes pulse { 50% { opacity: 0.35; } }
    /* #31: an UNSELECTED tab whose session needs you (urgent: the accent, quick)
       or finished (calm: green, slow). The model never marks the selected tab,
       and selecting one ends it. */
    /* Each look names its two colours once: the keyframes swing between them and
       reduced motion holds the high one. */
    .tab.pulse-needs {
      --pulse-lo-bg: color-mix(in srgb, var(--accent) 10%, var(--chrome));
      --pulse-hi-bg: color-mix(in srgb, var(--accent) 45%, var(--chrome));
      --pulse-lo-line: color-mix(in srgb, var(--accent) 40%, transparent);
      --pulse-hi-line: var(--accent);
      animation: tab-pulse-needs 1.1s ease-in-out infinite;
    }
    .tab.pulse-done {
      --pulse-lo-bg: var(--chrome);
      --pulse-hi-bg: color-mix(in srgb, var(--ok) 20%, var(--chrome));
      --pulse-lo-line: color-mix(in srgb, var(--ok) 25%, transparent);
      --pulse-hi-line: color-mix(in srgb, var(--ok) 70%, transparent);
      animation: tab-pulse-done 2.4s ease-in-out infinite;
    }
    @keyframes tab-pulse-needs {
      0%, 100% { background: var(--pulse-lo-bg); box-shadow: inset 0 -2px 0 var(--pulse-lo-line); }
      50% { background: var(--pulse-hi-bg); box-shadow: inset 0 -2px 0 var(--pulse-hi-line); }
    }
    @keyframes tab-pulse-done {
      0%, 100% { background: var(--pulse-lo-bg); box-shadow: inset 0 -2px 0 var(--pulse-lo-line); }
      50% { background: var(--pulse-hi-bg); box-shadow: inset 0 -2px 0 var(--pulse-hi-line); }
    }
    /* A running animation outranks a plain :hover background, so hovering stops it. */
    .tab.pulse-needs:hover, .tab.pulse-done:hover {
      animation: none; background: color-mix(in srgb, var(--accent) 10%, var(--chrome));
    }
    /* Reduced motion: the same call for a look, held still. */
    @media (prefers-reduced-motion: reduce) {
      .dot.working { animation: none; }
      .tab.pulse-needs, .tab.pulse-done {
        animation: none; background: var(--pulse-hi-bg); box-shadow: inset 0 -2px 0 var(--pulse-hi-line);
      }
      .tab.leaving { display: none; }
    }
    /* Visible only while the selected tab has no page of its own (starting,
       failed, or no worktrees yet); the tab's view covers it otherwise. */
    #pane { position: absolute; top: 34px; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    #pane[hidden] { display: none; }
    #pane-text { max-width: 560px; text-align: center; color: var(--dim); font-size: 13px; }
    #pane-retry { padding: 5px 14px; border-radius: 4px; cursor: pointer;
      background: var(--chrome); color: var(--text); border: 1px solid var(--border); }
    #pane-retry:hover { border-color: var(--accent); }
    #pane-retry[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="strip"><div id="tabs"></div><button type="button" id="lanes" hidden
      title="Lanes without a tab">Lanes ▾</button><button type="button" id="plus" hidden
      title="New branch, or a shell tab for this lane">+</button><form id="create" hidden><input
      id="create-branch" placeholder="feat/…" spellcheck="false" autocomplete="off"
      aria-label="New branch name" /><button type="button" id="create-issues"
      title="Pick one of this repo's open GitHub issues">From an issue ▾</button><button type="button" id="create-cancel" title="Cancel (Esc)">✕</button></form><div
      id="strip-alert" hidden></div><form id="index" autocomplete="off"><input id="index-note"
      placeholder="Note an idea, a bug, a fix…" spellcheck="false" maxlength="10000"
      aria-label="Note for the indexing assistant (Ctrl+Alt+N)" /><button type="button" id="index-chip"
      title="Adds to this project's backlog inbox. Click to switch project.">…</button></form><button type="button" id="index-count"
      aria-expanded="false" title="Today's notes: Undo, or Copy one that wasn't filed">0 filed</button><button type="button" id="lean-btn"
      title="Lean mode: just the terminal. Panels, pollers and animations stop; the look stays. A /bedtime night turns it on by itself.">☾ Lean</button><span id="lean-faces" hidden></span><span
      id="lean-chip" hidden><span id="lean-chip-label"></span><span id="lean-chip-night" hidden></span><button type="button"
      id="lean-back" title="Panels and animations come back">Back to normal</button></span><button type="button" id="stop-all"
      title="Stop every Claude session on this computer (asks first; writes ~/.claude/STOP-ALL)">STOP ALL</button><button type="button" id="bg" title="Running sessions">▾</button><button
      type="button" id="win-min" class="win-btn" title="Minimise" aria-label="Minimise" hidden>&#x2013;</button><button
      type="button" id="win-close" class="win-btn" title="Close window (sessions keep running)" aria-label="Close window"
      hidden>&#x2715;</button></div>
  <div id="pane" hidden>
    <div id="pane-text"></div>
    <button type="button" id="pane-retry" hidden>Retry</button>
  </div>
  <div id="issues-panel" hidden>
    <div id="issues-bar">
      <input id="issues-filter" placeholder="Search issues by number, title or label…" spellcheck="false" autocomplete="off"
        aria-label="Search the repo's open issues" />
      <button type="button" id="issues-close" title="Close the list (Esc)">✕</button>
    </div>
    <div id="issues-list"></div>
    <div id="issues-note" hidden></div>
  </div>
  <script src="./indexing-display.js"></script>
  <script src="./portrait-media-display.js"></script>
  <script src="./lean-display.js"></script>
  <script src="./program-status-display.js"></script>
  <script src="./tab-lanes.js"></script>
  <script src="./tab-strip.js"></script>
</body>
</html>
