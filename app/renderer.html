<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>claude-custom — spike</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    :root {
      --bg: #11131a;
      --chrome: #171a23;
      --border: #262b38;
      --text: #c7cede;
      --dim: #6d7689;
      --accent: #d08c4a;
      --ok: #5fb07a;
      --bad: #cc5f5f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100%; position: relative; }

    /* Per-project background art. Fixed and behind everything; the artwork is
       already dimmed to 10% in the SVG itself, so nothing here needs to darken
       it further and the palette stays the theme's. */
    #bg {
      position: fixed; inset: 0; z-index: 0;
      background-size: cover; background-position: center;
      pointer-events: none;
    }
    #app > * { position: relative; z-index: 1; }

    /* The terminal and panels must NOT paint an opaque background or the art
       behind them is invisible. Transparency here is what makes it a
       background rather than a border decoration. */
    body.has-bg #termwrap { background: transparent; }
    body.has-bg header,
    body.has-bg #roster,
    body.has-bg #diag { background: color-mix(in srgb, var(--chrome) 72%, transparent); }
    body.has-bg .xterm-viewport { background: transparent !important; }

    /* --- token spend ------------------------------------------------------- */
    #usage {
      display: flex; align-items: center; gap: 14px;
      font-size: 11px; color: var(--dim);
      -webkit-app-region: no-drag;
    }
    #usage .grp { display: flex; align-items: baseline; gap: 5px; }
    #usage .lbl { text-transform: uppercase; letter-spacing: .07em; font-size: 9.5px; opacity: .75; }
    #usage .val { color: var(--text); font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
    #usage .sub { opacity: .8; font-variant-numeric: tabular-nums; }

    header {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 14px;
      background: var(--chrome);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      flex: 0 0 auto;
    }
    header .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--bad); transition: background .2s;
    }
    header .dot.on { background: var(--ok); }
    header .title { font-weight: 600; letter-spacing: .2px; }
    header .cwd { color: var(--dim); font-size: 12px; }
    header .spacer { flex: 1; }
    header .hint {
      color: var(--dim); font-size: 11px;
      -webkit-app-region: no-drag;
    }
    header kbd {
      background: #222735; border: 1px solid var(--border);
      border-radius: 3px; padding: 1px 5px; font-size: 11px;
      font-family: ui-monospace, monospace;
    }

    #body { flex: 1; display: flex; min-height: 0; }

    #termwrap {
      flex: 1; min-width: 0; padding: 8px 10px;
      background: var(--bg);
    }
    #term { width: 100%; height: 100%; }

    #diag {
      width: 340px; flex: 0 0 340px;
      background: var(--chrome);
      border-left: 1px solid var(--border);
      display: none; flex-direction: column;
    }
    #diag.show { display: flex; }
    #diag h2 {
      margin: 0; padding: 10px 12px;
      font-size: 12px; text-transform: uppercase;
      letter-spacing: .08em; color: var(--accent);
      border-bottom: 1px solid var(--border);
    }
    #checks { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    #checks div { padding: 3px 0; font-size: 12px; color: var(--dim); }
    #checks div.hit { color: var(--ok); }
    #checks .mark { display: inline-block; width: 16px; }
    #log {
      flex: 1; overflow-y: auto; padding: 8px 12px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 11px; line-height: 1.6;
    }
    #log .row { padding: 2px 0; border-bottom: 1px solid #1d212c; }
    #log .k { color: var(--accent); }
    #log .b { color: var(--text); }
    #log .n { color: var(--dim); }

    /* --- agent roster ------------------------------------------------------
       Reactive, not a gallery: an agent appears when it first runs and its
       portrait reflects the mood machine's state. */
    #roster {
      width: 180px; flex: 0 0 180px;
      background: var(--chrome);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    #roster h2 {
      margin: 0; padding: 10px 12px;
      font-size: 11px; text-transform: uppercase;
      letter-spacing: .08em; color: var(--dim);
      border-bottom: 1px solid var(--border);
    }
    #agents { flex: 1; overflow-y: auto; padding: 8px; }
    #agents .empty { color: var(--dim); font-size: 11px; padding: 8px; line-height: 1.5; }

    .agent {
      display: flex; align-items: center; gap: 9px;
      padding: 6px; border-radius: 6px; margin-bottom: 4px;
      transition: background .25s, opacity .35s;
    }
    .agent .face {
      width: 34px; height: 34px; flex: 0 0 34px;
      border-radius: 7px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; letter-spacing: .04em;
      color: #0e1017;
      border: 1px solid rgba(255,255,255,.10);
    }
    .agent .face img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .agent .meta { min-width: 0; }
    .agent .name {
      font-size: 11.5px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .agent .state { font-size: 10px; color: var(--dim); text-transform: capitalize; }

    /* State is carried by opacity and a ring, so it still reads when the
       portrait itself is a placeholder. */
    .agent[data-state="sleeping"] { opacity: .42; }
    .agent[data-state="working"]  { background: rgba(255,255,255,.05); }
    .agent[data-state="working"] .face { box-shadow: 0 0 0 2px var(--accent); }
    .agent[data-state="happy"]    { background: rgba(95,176,122,.14); }
    .agent[data-state="happy"] .face { box-shadow: 0 0 0 2px var(--ok); }
    .agent[data-state="stressed"] { background: rgba(204,95,95,.14); }
    .agent[data-state="stressed"] .face { box-shadow: 0 0 0 2px var(--bad); }
    .agent[data-state="working"] .state { color: var(--accent); }
    .agent[data-state="happy"] .state { color: var(--ok); }
    .agent[data-state="stressed"] .state { color: var(--bad); }

    /* --- permission mode ---------------------------------------------------
       Five modes, measured by cycling shift+tab. Bypass is flagged because
       "running with permissions bypassed" should be impossible to forget. */
    #mode { display: flex; align-items: center; gap: 6px; font-size: 10.5px;
            padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
            -webkit-app-region: no-drag; }
    #mode .lvl { display: flex; gap: 2px; }
    #mode .lvl i { width: 3px; height: 9px; border-radius: 1px; background: var(--border); }
    #mode .lvl i.on { background: var(--accent); }
    #mode .nm { color: var(--text); font-weight: 600; }
    #mode.risky { border-color: var(--bad); }
    #mode.risky .nm { color: var(--bad); }
    #mode.risky .lvl i.on { background: var(--bad); }

    /* --- party -------------------------------------------------------------
       The live delegation chain, so a subagent that quietly spawned six more
       is visible rather than inferred. */
    #party { padding: 6px 8px; border-top: 1px solid var(--border); font-size: 10.5px; }
    #party .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; }
    #party .who { background: rgba(255,255,255,.06); border-radius: 4px; padding: 1px 5px; }
    #party .who.inner { background: var(--accent); color: #12141c; font-weight: 600; }
    #party .arrow { color: var(--dim); }
    #party .none { color: var(--dim); opacity: .7; }

    /* --- running processes -------------------------------------------------
       Long work must be visible. A four-minute GPU job that shows nothing is
       indistinguishable from a hung session. */
    #procs { border-top: 1px solid var(--border); padding: 8px; flex: 0 0 auto; max-height: 190px; overflow-y: auto; }
    #procs h3 { margin: 0 0 6px; font-size: 10px; text-transform: uppercase;
                letter-spacing: .08em; color: var(--dim); font-weight: 600; }
    #procs .none { color: var(--dim); font-size: 10.5px; opacity: .7; }
    .proc { display: flex; align-items: baseline; gap: 6px; padding: 3px 0; font-size: 11px; }
    .proc .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
                 flex: 0 0 5px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    .proc .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
                 text-overflow: ellipsis; font-family: ui-monospace, monospace; font-size: 10.5px; }
    .proc .el { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 10px; }
    /* Anything past a minute is worth noticing rather than assuming hung. */
    .proc.slow .el { color: var(--accent); }

    /* Scrollbars follow the theme. The default chrome scrollbar is a bright
       grey slab that ignores the palette entirely and is the one element that
       gives away that this is a web view rather than a terminal. */
    .xterm-viewport::-webkit-scrollbar,
    #agents::-webkit-scrollbar,
    #log::-webkit-scrollbar { width: 9px; }
    .xterm-viewport::-webkit-scrollbar-track,
    #agents::-webkit-scrollbar-track,
    #log::-webkit-scrollbar-track { background: transparent; }
    .xterm-viewport::-webkit-scrollbar-thumb,
    #agents::-webkit-scrollbar-thumb,
    #log::-webkit-scrollbar-thumb {
      background: var(--border); border-radius: 5px;
      border: 2px solid transparent; background-clip: content-box;
    }
    .xterm-viewport::-webkit-scrollbar-thumb:hover,
    #agents::-webkit-scrollbar-thumb:hover,
    #log::-webkit-scrollbar-thumb:hover { background: var(--dim); background-clip: content-box; }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="app">
    <header>
      <span class="dot" id="dot"></span>
      <span class="title">claude-custom</span>
      <span class="cwd" id="cwd"></span>
      <span class="spacer"></span>
      <span id="mode" title="Permission mode — shift+tab cycles"></span>
      <span id="usage" title="Tokens read from Claude Code's own transcripts"></span>
      <span class="hint">diagnostics <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>D</kbd></span>
    </header>
    <div id="body">
      <div id="termwrap"><div id="term"></div></div>
      <aside id="roster">
        <h2>Agents</h2>
        <div id="agents"><div class="empty">No agents yet — portraits light up when one runs.</div></div>
        <div id="party"><div class="chain"><span class="none">no delegation</span></div></div>
        <div id="procs">
          <h3>Running</h3>
          <div id="proclist"><div class="none">nothing running</div></div>
        </div>
      </aside>
      <aside id="diag">
        <h2>Key diagnostics</h2>
        <div id="checks"></div>
        <div id="log"></div>
      </aside>
    </div>
  </div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
