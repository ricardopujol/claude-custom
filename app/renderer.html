<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>claude-custom — spike</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    :root {
      --bg: #11131a;
      --chrome: #171a23;
      --border: #262b38;
      --text: #c7cede;
      --dim: #6d7689;
      --accent: #d08c4a;
      --ok: #5fb07a;
      --bad: #cc5f5f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100%; }

    header {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 14px;
      background: var(--chrome);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      flex: 0 0 auto;
    }
    header .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--bad); transition: background .2s;
    }
    header .dot.on { background: var(--ok); }
    header .title { font-weight: 600; letter-spacing: .2px; }
    header .cwd { color: var(--dim); font-size: 12px; }
    header .spacer { flex: 1; }
    header .hint {
      color: var(--dim); font-size: 11px;
      -webkit-app-region: no-drag;
    }
    header kbd {
      background: #222735; border: 1px solid var(--border);
      border-radius: 3px; padding: 1px 5px; font-size: 11px;
      font-family: ui-monospace, monospace;
    }

    #body { flex: 1; display: flex; min-height: 0; }

    #termwrap {
      flex: 1; min-width: 0; padding: 8px 10px;
      background: var(--bg);
    }
    #term { width: 100%; height: 100%; }

    #diag {
      width: 340px; flex: 0 0 340px;
      background: var(--chrome);
      border-left: 1px solid var(--border);
      display: none; flex-direction: column;
    }
    #diag.show { display: flex; }
    #diag h2 {
      margin: 0; padding: 10px 12px;
      font-size: 12px; text-transform: uppercase;
      letter-spacing: .08em; color: var(--accent);
      border-bottom: 1px solid var(--border);
    }
    #checks { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    #checks div { padding: 3px 0; font-size: 12px; color: var(--dim); }
    #checks div.hit { color: var(--ok); }
    #checks .mark { display: inline-block; width: 16px; }
    #log {
      flex: 1; overflow-y: auto; padding: 8px 12px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 11px; line-height: 1.6;
    }
    #log .row { padding: 2px 0; border-bottom: 1px solid #1d212c; }
    #log .k { color: var(--accent); }
    #log .b { color: var(--text); }
    #log .n { color: var(--dim); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="dot" id="dot"></span>
      <span class="title">claude-custom</span>
      <span class="cwd" id="cwd"></span>
      <span class="spacer"></span>
      <span class="hint">diagnostics <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>D</kbd></span>
    </header>
    <div id="body">
      <div id="termwrap"><div id="term"></div></div>
      <aside id="diag">
        <h2>Key diagnostics</h2>
        <div id="checks"></div>
        <div id="log"></div>
      </aside>
    </div>
  </div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
