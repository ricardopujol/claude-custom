# Windows installer and portable zip for claude-custom. `npm run dist` reads this file; nothing is signed.
#
# The app is NOT packed into an asar. Three things need real files on disk: node-pty's native binaries, the hook helper (an
# .exe the host spawns), and the `.harness` folder next to the code, where the host writes its token, identity and log files.
# The installer's default is per-user (%LOCALAPPDATA%\Programs\claude-custom), which is writable, so that folder works.
appId: com.ricardopujol.claude-custom
productName: claude-custom
copyright: Ricardo Pujol

directories:
  output: dist

asar: false
# node-pty ships N-API prebuilds, so there is nothing to rebuild for Electron.
npmRebuild: false

# An ALLOW-LIST, never "everything except": electron-builder reads the DISK, not git, so a local backgrounds/ folder, a portraits/
# folder, a .env or a registry/projects.json.pre-migration would ride along in a build made from a working checkout. Only the app's
# own folders are named, and the patterns after them take out what can sit inside them. The hook helper is the one build artefact
# (gitignored, in .harness/) the app can't work without; `npm run dist` refuses to run when it's missing (scripts/check-dist-inputs.js).
# test/packaging-config.test.js pins all of this, including that no gitignored file under a listed folder escapes a pattern here.
files:
  - "app/**"
  - "host/**"
  - "bin/**"
  - "registry/**"
  - "package.json"
  - ".harness/hook-helper.exe"
  - "!**/*.map"
  - "!**/*.log"
  - "!**/.env*"
  - "!**/*.pre-migration"
  - "!**/secrets.enc"
  - "!**/session-token"
  - "!**/*.token"
  - "!test/**"
  - "!verify/**"
  - "!forge/**"
  - "!documentation/**"
  - "!reports/**"
  - "!backgrounds/**"
  - "!portraits/**"

win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  # shortcut: no code signing in v1. Windows SmartScreen will warn on the installer; upgrade when there are users who need it gone.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  # false: the app writes its state (.harness: token, identity, log, layout) beside its code, so it can't live under Program Files.
  # Per-user only, in %LOCALAPPDATA%\Programs. An update replaces that folder, so layout and log don't survive one (BACKLOG: move .harness to userData).
  allowToChangeInstallationDirectory: false
  artifactName: claude-custom-setup-${version}.${ext}
